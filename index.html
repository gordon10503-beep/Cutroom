<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cutroom · Media studio</title><link rel="stylesheet" href="/style.css"></head><body>
<aside><div class="brand"><span class="brandmark"><i></i><i></i><i></i></span>Cutroom<span class="branddot">.</span></div><div class="studio">PERSONAL MEDIA STUDIO</div><div class="navlabel">WORKSPACE</div><nav id="nav"></nav><div class="local"><span></span> Local workspace</div></aside>
<main><header><span>Workspace <b>/</b> <strong id="crumb"></strong></span><span class="session"><i></i> Studio online</span></header><section class="heading"><div><h1 id="title"></h1><p id="subtitle"></p></div><button class="import" id="import"></button></section>
<section class="workspace"><article class="panel media"><div class="panelhead"><h2><span id="monitor"></span> Media preview</h2><span class="smalltag" id="resolution"></span></div><div id="stage"></div><div id="player"></div><div id="source"></div></article>
<article class="panel settings"><div class="panelhead"><h2><span id="sliders"></span> <span id="settingsTitle"></span></h2></div><div id="settings"></div><div class="apply"><button class="primary" id="export"></button><div id="status" role="status"></div></div></article></section>
<section class="panel output"><div class="panelhead"><h2><span id="layers"></span><span id="outputTitle"></span></h2><span id="outputCount" class="smalltag"></span></div><div id="results"></div></section></main><input hidden type="file" id="file"><script src="/app.js"></script></body></html>
